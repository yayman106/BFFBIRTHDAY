<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story ❤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen" class="lock-screen">
        <div class="lock-box">
            <h2>Enter the Password 🔒</h2>
            <input type="password" id="password-input" placeholder="Password...">
            <button onclick="checkPassword()">Enter</button>
            <p id="error-msg" style="color: red; display: none;">Wrong password!</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="main-content hidden">
        <header>
            <h1>The little place that holds our story ❤</h1>
        </header>

        <!-- Timer Section -->
        <section class="timer-section">
            <h2>Our Beginning 💕</h2>
            <div id="timer">
                <div><span id="days">0</span> Days</div>
                <div><span id="hours">0</span> Hours</div>
                <div><span id="minutes">0</span> Minutes</div>
                <div><span id="seconds">0</span> Seconds</div>
            </div>
        </section>

        <!-- Song Section -->
        <section class="music-section">
            <h3>🎵 Our Song</h3>
            <audio id="bg-music" src="song.mp3" controls></audio>
        </section>

        <!-- Gallery Section -->
        <section class="gallery-section">
            <h3>📸 Our Memories</h3>
            <div class="gallery">
                <img src="images/pic1.jpg" alt="Memory 1">
                <img src="images/pic2.jpg" alt="Memory 2">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
